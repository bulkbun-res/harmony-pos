name: CI (build + typecheck)

# بيتشغّل على GitHub Actions لأن جهاز التطوير 1GB RAM — البناء محتاج رام أكتر.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # البناء هو الحاجز الحقيقي — لو نجح التطبيق بيتنشر.
      - name: Build
        run: npm run build

      # tsc بقى حاجز: الريبو نضيف من أخطاء الأنواع بعد إصلاح 65 خطأ قديم.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # نرفع tarball واحد فيه .output و .wrangler — عشان النشر يتم من
      # الجهاز بـ wrangler deploy بس (بدون build محلي على جهاز 1GB).
      - name: Pack deployable output
        if: success()
        run: tar -czf deploy-output.tgz .output .wrangler

      - name: Upload deploy artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-output
          path: deploy-output.tgz
          retention-days: 5
          if-no-files-found: error
